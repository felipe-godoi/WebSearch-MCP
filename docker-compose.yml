services:
  websearch-mcp:
    build: .
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      MCP_TRANSPORT: http
      MCP_API_KEY: ${MCP_API_KEY:?Set MCP_API_KEY in Dokploy environment variables}
      FIRECRAWL_API_URL: ${FIRECRAWL_API_URL:-http://firecrawl-api:3002}
      FIRECRAWL_API_KEY: ${FIRECRAWL_API_KEY:-}
      MAX_SEARCH_RESULT: ${MAX_SEARCH_RESULT:-5}
      PORT: 3000
      HOST: 0.0.0.0
    networks:
      - dokploy-network
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').request('http://localhost:3000/health', (r) => { process.exit(r.statusCode === 200 ? 0 : 1) }).end()\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

networks:
  dokploy-network:
    external: true
